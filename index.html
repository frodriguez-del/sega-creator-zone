<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEGA Creator Zone Quest Analytics</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: light Creator Zone page. White header with the Creator Zone mark and section tabs; each view opens with a
   plain page heading on the soft blue-grey ground, then white panels. One view at a time, routed by the link's #token. */
:root {
  --bg: #F4F6FB;
  --surface: #FFFFFF;
  --surface-2: #EEF2FA;
  --ink: #0B1636;
  --ink-2: #33405F;
  --muted: #5A6684;
  --line: #DCE3F2;
  --grid: #E6EBF5;
  --navy: #00216A;
  --accent: #1F56E0;
  --accent-soft: #E3EBFD;
  --hero-tile: #E8EEFC;
  --ip-sonic: #1660DB;
  --ip-atlus: #D9352B;
  --ip-rgg: #C2449B;
  --ip-ca: #1F9D72;
  --ip-lic: #E8A500;
  --ch-sega: #1C9BD0;
  --ch-creator: #9146FF;
  --ch-atlus: #D9352B;
  --fmt-short: #1F56E0;
  --fmt-long: #E07A1F;
  --fmt-live: #8A94AD;
  --cr-new: #1FA5C6;
  --cr-ret: #1F56E0;
  --rest: #DCE3F2;
  --pend-bg: #EEF1F6;
  --pend-ink: #66708A;
  --warn-ink: #8A4B00;
  --warn-bg: #FFF1DC;
  --shadow: 0 1px 2px rgba(11,22,54,.05);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1226; --surface: #111C38; --surface-2: #172446; --ink: #EDF1FA; --ink-2: #C6D0E6; --muted: #8F9BBA;
    --line: #24345C; --grid: #1B2A4F; --navy: #C9D7FF; --accent: #7EA4FF; --accent-soft: #1C2F5E; --hero-tile: #172C5C;
    --ip-sonic: #4A8BF0; --ip-atlus: #E34A3F; --ip-rgg: #C750C9; --ip-ca: #1E9E6E; --ip-lic: #BA8500; --ch-sega: #2A9FD4; --ch-creator: #9146FF; --ch-atlus: #E34A3F; --fmt-short: #4F7FEA; --fmt-long: #CF7623; --fmt-live: #6F7C9E; --cr-new: #16A0A8; --cr-ret: #4F7FEA; --rest: #2A3A62;
    --pend-bg: #18254A; --pend-ink: #95A1C0; --warn-ink: #FFC96B; --warn-bg: #2E2410; --shadow: none; color-scheme: dark;
  }
  :root:not([data-theme="light"]) .logo-l { display: none; }
  :root:not([data-theme="light"]) .logo-d { display: block; }
}
:root[data-theme="dark"] {
  --bg: #0A1226; --surface: #111C38; --surface-2: #172446; --ink: #EDF1FA; --ink-2: #C6D0E6; --muted: #8F9BBA;
  --line: #24345C; --grid: #1B2A4F; --navy: #C9D7FF; --accent: #7EA4FF; --accent-soft: #1C2F5E; --hero-tile: #172C5C;
  --ip-sonic: #4A8BF0; --ip-atlus: #E34A3F; --ip-rgg: #C750C9; --ip-ca: #1E9E6E; --ip-lic: #BA8500; --ch-sega: #2A9FD4; --ch-creator: #9146FF; --ch-atlus: #E34A3F; --fmt-short: #4F7FEA; --fmt-long: #CF7623; --fmt-live: #6F7C9E; --cr-new: #16A0A8; --cr-ret: #4F7FEA; --rest: #2A3A62;
  --pend-bg: #18254A; --pend-ink: #95A1C0; --warn-ink: #FFC96B; --warn-bg: #2E2410; --shadow: none; color-scheme: dark;
}
:root[data-theme="dark"] .logo-l { display: none; }
:root[data-theme="dark"] .logo-d { display: block; }

* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.logo-d { display: none; }

/* Header */
.band { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.band .wrap { padding-block: 12px 0; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand a { display: flex; align-items: center; gap: 16px; color: inherit; text-decoration: none; }
.brand img { height: 46px; width: auto; }
.brand .hubname { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--navy); padding-left: 16px; border-left: 2px solid var(--line); line-height: 1.2; letter-spacing: -.01em; }
.brand .hubname span { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.brand .asof { font-size: 12.5px; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -6px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; padding: 10px 10px 11px; border-bottom: 3px solid transparent; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.tabs a:hover { color: var(--navy); }
.tabs a[aria-current="page"] { color: var(--navy); border-bottom-color: var(--accent); }

/* Page heading */
.hero .wrap { padding-block: 30px 6px; display: flex; flex-direction: column; gap: 12px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--accent); text-decoration: none; font-weight: 600; }
.crumbs a:hover { text-decoration: underline; }
.eyebrow { font-family: var(--font-display); font-size: 12.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(32px, 5vw, 56px); line-height: .98; letter-spacing: -.02em; margin: 0; color: var(--navy); text-wrap: balance; max-width: 22ch; }
.hero.quest h1 { font-size: clamp(28px, 4vw, 44px); max-width: 28ch; }
.lede { max-width: 72ch; color: var(--ink-2); font-size: 16.5px; margin: 0; }
.lede b { color: var(--ink); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pills > span { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink-2); }
.copy { font: 600 13px var(--font-body); color: var(--navy); background: var(--surface); border: 1.5px solid var(--navy); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.copy:hover { background: var(--surface-2); }
.linkbox { font: 12.5px var(--font-data); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; width: min(100%, 420px); }

main .wrap { padding-block: 22px 64px; display: flex; flex-direction: column; gap: 40px; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 8px 24px; flex-wrap: wrap; }
.sec-head > div:not(.seg) { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kicker { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 3vw, 28px); line-height: 1.1; margin: 0; letter-spacing: -.015em; color: var(--navy); text-wrap: balance; }
.sec-note { color: var(--muted); font-size: 14px; max-width: 62ch; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 20px 0; }
.panel-h h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.panel-b { padding: 14px 20px 18px; }
.muted { color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 3.8vw, 38px); line-height: 1.1; letter-spacing: -.02em; color: var(--navy); }
.kpi .l { font-size: 14px; font-weight: 600; color: var(--ink); }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.hero-k { background: var(--hero-tile); border-color: transparent; }
.kpi.pending .v { color: var(--pend-ink); }

/* IP hub tiles */
.ipgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1080px) { .ipgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 720px) { .ipgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .ipgrid { grid-template-columns: minmax(0, 1fr); } }
.iptile { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; border-top: 4px solid var(--c); transition: border-color .15s, box-shadow .15s; }
.iptile:hover { box-shadow: 0 4px 14px rgba(11,22,54,.08); }
.iptile h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.1; color: var(--navy); }
.iptile .fr { font-size: 12.5px; color: var(--muted); margin-top: -6px; min-height: 2.6em; }
.ipst { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ipst div { display: flex; flex-direction: column; }
.ipst b { font-family: var(--font-data); font-weight: 500; font-size: 15.5px; }
.ipst span { font-size: 11.5px; color: var(--muted); }
.cov { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }
.covbar { height: 6px; background: var(--pend-bg); border-radius: 3px; overflow: hidden; display: flex; }
.covbar i { display: block; height: 100%; background: var(--c); }
.go { font-size: 13px; font-weight: 600; color: var(--accent); }

.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* Bars */
.hbars { display: flex; flex-direction: column; gap: 11px; }
.hrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 70px; gap: 12px; align-items: center; color: inherit; text-decoration: none; }
a.hrow:hover .name { color: var(--accent); }
.hrow .name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; }
.hrow .name span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 16px; position: relative; border-left: 1px solid var(--line); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
.hrow .val { font-family: var(--font-data); font-size: 13px; text-align: right; }

/* Tables */
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
td.num, .mono { font-family: var(--font-data); font-size: 13px; }
tbody tr:last-child td { border-bottom: 0; }
.minibar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.minibar .mt { width: 84px; display: flex; }
.minibar i { display: block; height: 8px; border-radius: 0 3px 3px 0; min-width: 2px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.pill.muted { background: var(--surface-2); color: var(--muted); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.st.recap, .st.stream { background: var(--accent-soft); color: var(--navy); }
.st.pending { background: var(--pend-bg); color: var(--pend-ink); }
.st.link { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.qrow { cursor: pointer; }
.qrow:hover td { background: var(--surface-2); }
.qrow td:first-child a { color: var(--ink); text-decoration: none; font-weight: 600; }
.qrow:hover td:first-child a { color: var(--accent); }
.qrow.pend td { color: var(--pend-ink); }
.qrow.pend td:first-child a { color: var(--ink-2); font-weight: 500; }
.qsub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

/* Filters */
.filters { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 13px/1 var(--font-body); color: var(--navy); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--surface); border-color: var(--navy); }
input[type="search"] { font: 500 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 12px; width: min(100%, 280px); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 600 12.5px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 7px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--navy); }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.chart .lbl { fill: var(--ink); font-size: 12px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Top posts */
.toplist { display: flex; flex-direction: column; }
.trow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.trow:last-child { border-bottom: 0; }
.trow .rk { font-family: var(--font-data); color: var(--muted); font-size: 13px; }
.trow .who { display: flex; flex-direction: column; min-width: 0; }
.trow .who b { font-weight: 600; font-size: 14px; }
.trow .who span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .who a { color: var(--muted); }
.trow .nums { text-align: right; display: flex; flex-direction: column; }
.trow .nums b { font-family: var(--font-data); font-weight: 500; font-size: 14px; }
.trow .nums span { font-size: 12px; color: var(--muted); }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.ccard { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; border-left: 4px solid var(--c); }
.ccard:hover b.t { color: var(--accent); }
.ccard .m { font-size: 12.5px; color: var(--muted); }
.ccard b.t { font-size: 15px; font-weight: 600; line-height: 1.3; }
.ccard .row { display: flex; gap: 16px; font-family: var(--font-data); font-size: 13px; }
.ccard .row span { color: var(--muted); font-family: var(--font-body); font-size: 11.5px; display: block; }

/* Quest page */
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
.dbox { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.dbox h3 { margin: 0; font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.dbox p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.dbox ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.deck { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; background: var(--navy); color: var(--surface); padding: 10px 16px; border-radius: 8px; align-self: flex-start; }
.deck:hover { opacity: .9; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager a { text-decoration: none; font-weight: 600; font-size: 14px; display: flex; flex-direction: column; max-width: 48%; }
.pager a span { font-size: 12px; color: var(--muted); font-weight: 500; }
.pager a.next { text-align: right; margin-left: auto; }
.placeholder { padding: 22px; display: flex; flex-direction: column; gap: 10px; border: 2px dashed var(--line); background: var(--surface); border-radius: var(--r); }
.placeholder h3 { margin: 0; font-size: 16px; color: var(--navy); }
.placeholder p { margin: 0; color: var(--ink-2); max-width: 70ch; }

/* Streams */
.sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .sgrid { grid-template-columns: minmax(0, 1fr); } }
.scard { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; border-top: 4px solid var(--c); }
.scard h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.scard h3 a { color: inherit; text-decoration: none; } .scard h3 a:hover { color: var(--accent); }
.sstats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sstats div { display: flex; flex-direction: column; }
.sstats b { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; color: var(--navy); }
.sstats span { font-size: 12px; color: var(--muted); }
.scard .note { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin: 0; }
.chan { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }

.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
dl { margin: 0; display: flex; flex-direction: column; gap: 12px; }
dt { font-weight: 600; font-size: 14px; }
dd { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.sources { columns: 2; column-gap: 24px; font-size: 13.5px; padding-left: 18px; margin: 0; }
.sources li { break-inside: avoid; padding: 2px 0; }
@media (max-width: 640px) { .sources { columns: 1; } }
.empty { padding: 26px 20px; color: var(--muted); text-align: center; font-size: 14px; }
/* Totals + per-creator strips */
.kgroup { display: flex; flex-direction: column; gap: 8px; }
.klabel { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.klabel span { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
.kpis.avg .kpi { background: var(--surface-2); border-color: transparent; }
.kpis.avg .kpi .v { font-size: clamp(24px, 3.2vw, 32px); }
.ipst + .pc { font-size: 12px; color: var(--muted); margin-top: -4px; }

/* View heading: full-bleed hero band with neon lines */
.hero { position: relative; background: var(--hero); color: #fff; overflow: hidden;
  background-image: linear-gradient(115deg, transparent 0 62%, rgba(61,123,255,.0) 62%),
    repeating-linear-gradient(115deg, transparent 0 140px, rgba(61,123,255,.28) 140px 142px); }
.hero::after { content: ""; position: absolute; right: -70px; top: -70px; width: 260px; height: 260px; border: 2px solid var(--neon); border-radius: 50%; opacity: .45; pointer-events: none; }
.hero .wrap { position: relative; z-index: 1; max-width: 1240px; padding-block: 44px 40px; }
.hero h1, .hero.quest h1 { color: #fff; font-weight: 900; font-style: italic; letter-spacing: -.025em; line-height: .92; }
.hero h1 { font-size: clamp(34px, 6vw, 72px); }
.hero.quest h1 { font-size: clamp(28px, 4.4vw, 50px); }
.hero .crumbs { color: var(--mist); } .hero .crumbs a { color: #fff; }
.hero .eyebrow { color: var(--mist); font-weight: 700; letter-spacing: .04em; }
.hero .lede { color: #dfe6ff; } .hero .lede b { color: #fff; }
.hero .pills > span { background: transparent; border: 1.5px solid rgba(255,255,255,.55); color: #fff; font-size: 12px; font-weight: 600; }
.hero .chip { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.hero .chip:hover { border-color: #fff; }
.hero .chip[aria-pressed="true"] { background: var(--electric); border-color: var(--electric); color: #fff; }
.hero .copy { background: transparent; color: #fff; border-color: #fff; }
.hero .linkbox { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.25); }
.hero a { color: #fff; }
main .wrap, #view > .wrap, #view main .wrap { max-width: 1240px; }

/* Type */
.eyebrow, .kicker { font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; color: var(--electric); }
h1 { font-family: var(--font-display); }
h2 { font-weight: 800; text-transform: uppercase; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.panel-h h3 { font-weight: 700; }
.klabel { font-weight: 800; letter-spacing: .02em; color: var(--ink); }

/* Panels: square, flat */
.panel { border-radius: 0; border: 0; box-shadow: 0 1px 0 rgba(10,31,92,.08); }
.kpi .v { font-weight: 900; font-style: italic; letter-spacing: -.025em; color: var(--ink); }
.kpi.hero-k { background: var(--electric); }
.kpi.hero-k .v, .kpi.hero-k .l { color: #fff; } .kpi.hero-k .s { color: #e3eaff; }

.headline { border-top: 5px solid var(--electric); }
.headline .big { font-weight: 800; color: var(--ink); }
.find, .ftile, .calc .outs div, .gcard, .rec, .placeholder, .calc .verdict { border-radius: 0; }
.find .n, .ftile .big, .sstats b, .ctx .row4 b, .calc .outs b { font-weight: 900; font-style: italic; letter-spacing: -.02em; color: var(--ink); }
.donut .c1 { font-weight: 900; font-style: italic; fill: var(--ink); }
.rec::before { background: var(--electric); border-radius: 0; font-style: italic; font-weight: 900; }

/* Franchise tiles: thick franchise band on top, big italic name */
.iptile { border-top: 8px solid var(--c); }
.iptile h3 { font-weight: 900; font-style: italic; text-transform: uppercase; color: var(--ink); letter-spacing: -.02em; }
.iptile:hover { box-shadow: 0 0 0 2px var(--c); }
.ipst b { font-weight: 700; }
.covbar { border-radius: 0; } .covbar i { transform: skewX(-14deg); transform-origin: left; }
.scard, .chcard { border-top-width: 8px; }
.chcard h3 { font-weight: 900; font-style: italic; text-transform: uppercase; color: var(--ink); }
.ccard, .act { border-left-width: 5px; }
.go { color: var(--electric); font-weight: 700; text-transform: uppercase; font-size: 12.5px; }

/* Bars: slanted fills, square ends */
.fill, .minibar i, .sbar i, .cbar .t i, .mbar .t i, .pb .t i, .fbar i { border-radius: 0 !important; }
.fill { transform: skewX(-14deg); transform-origin: left; }

/* Controls */
.chip { border-radius: 999px; font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--ink); border-color: #c9d2ee; }
.chip[aria-pressed="true"] { background: var(--electric); border-color: var(--electric); color: #fff; }
.seg { border-radius: 0; } .seg button { font-weight: 700; text-transform: uppercase; font-size: 11.5px; }
.seg button[aria-pressed="true"] { background: var(--electric); color: #fff; }
input[type="search"], .calc select, .calc input { border-radius: 0; font-family: var(--font-body); }
.copy { border-radius: 0; text-transform: uppercase; font-weight: 700; font-size: 12px; }
.deck { position: relative; background: transparent; color: #fff; border-radius: 0; text-transform: uppercase; font-weight: 700; font-size: 14px; padding: 12px 24px; isolation: isolate; }
.deck::before { content: ""; position: absolute; inset: 0; background: var(--electric); transform: skewX(-14deg); z-index: -1; }
.deck:hover::before { background: #2b6bff; } .deck:hover { opacity: 1; }
.pill { font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .02em; padding: 4px 10px; background: var(--electric); color: #fff; }
.pill.muted { background: #5b6690; color: #fff; }
.pill.warn { background: #ffd23f; color: #0e1330; }
.st { border-radius: 999px; font-weight: 700; font-size: 10.5px; padding: 4px 10px; }
.st.recap, .st.stream { background: var(--electric); color: #fff; }
.st.pending { background: #5b6690; color: #fff; }
.chan { border-radius: 999px; font-weight: 700; font-size: 11px; text-transform: uppercase; }
.todo { border-radius: 999px; text-transform: uppercase; font-size: 10.5px; font-weight: 700; }
th { font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.gcard .th .kd { background: var(--electric); border-radius: 999px; text-transform: uppercase; font-size: 10px; font-weight: 700; }
.gcard .th .pf { font-weight: 900; font-style: italic; color: var(--ink-2); }
.gcard:hover { border-color: var(--electric); }

.pager a { color: var(--electric); font-weight: 700; text-transform: uppercase; font-size: 13px; }
#tip { background: var(--night); color: #fff; border-radius: 0; }

/* Hero: content left, period + sources panel right */
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px 40px; align-items: end; }
.hero-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.hero-side .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
.hero-side .periods { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.hero-side .meta { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid rgba(255,255,255,.18); display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #dfe6ff; }
.hero-side .meta b { color: #fff; font-weight: 600; }
.hero-side .printbtn { background: none; border: 0; padding: 0; color: #fff; font: 700 12px var(--font-body); text-transform: uppercase; letter-spacing: .02em; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; align-self: flex-start; }
.hero .lede { font-size: 16px; max-width: 58ch; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }
/* Key data learnings: the one block most readers will see, so it is big and high-contrast */
.learn { padding: 30px 32px 26px; display: flex; flex-direction: column; gap: 20px; background: var(--hero); color: #fff; border-top: 6px solid var(--electric); position: relative; overflow: hidden;
  background-image: repeating-linear-gradient(115deg, transparent 0 140px, rgba(61,123,255,.18) 140px 142px); }
.learn .kicker { color: var(--mist); font-size: 14px; letter-spacing: .08em; }
.learn .sum { margin: 0; font-size: clamp(19px, 2vw, 24px); line-height: 1.4; color: #dfe6ff; max-width: 70ch; font-weight: 500; }
.learn .sum b { color: #fff; font-weight: 800; }
.learn .finds { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.learn .find { background: #fff; border-top: 6px solid var(--electric); padding: 20px 20px 22px; gap: 8px; }
.learn .find .n { font-size: clamp(40px, 4.2vw, 54px); line-height: .95; color: var(--electric); }
.learn .find h4 { font-size: 18px; font-weight: 800; line-height: 1.25; color: var(--ink); }
.learn .find p { font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.learn .sec-note { color: var(--mist) !important; font-size: 12.5px !important; }
@media (max-width: 1080px) { .learn .finds { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .learn { padding: 22px 18px; } .learn .finds { grid-template-columns: minmax(0, 1fr); } }
@media print { .hero-side .periods, .hero-side .printbtn, .hero-side .lbl.pl { display: none !important; } .hero-grid { grid-template-columns: minmax(0,1fr); } }

/* Footer: night */

footer .wrap { max-width: 1240px; color: var(--mist); padding-block: 28px 36px; }

<script>
/* Apps Script navigation helper.
   The hub switches tabs with #links (#sonic, #cost...). Inside an Apps Script web app the page runs in
   Google's sandboxed frame, so this helper:
   - opens outside links (recaps, sources) in a new tab instead of inside the dashboard frame,
   - mirrors the current tab into the browser's address bar so links like .../exec#sonic can be shared,
   - opens the right tab when someone arrives on a shared .../exec#sonic link,
   - points the "Copy link to this page" buttons at this web app instead of the claude.ai artifact. */
(function () {
  var gs = window.google && google.script;
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    // Apps Script adds <base target="_top">, which sends #tab links to a blank Google page. Switch tabs in place instead.
    if (href.charAt(0) === '#') {
      e.preventDefault();
      if (location.hash !== href) location.hash = href;
      else window.dispatchEvent(new HashChangeEvent('hashchange'));
      return;
    }
    if (/^https?:/i.test(href) && !a.getAttribute('target')) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener'); }
  }, true);
  if (!gs) return;
  var mirror = function () {
    try { gs.history.replace(null, null, location.hash.slice(1)); } catch (err) {}
  };
  window.addEventListener('hashchange', mirror);
  try {
    gs.url.getLocation(function (loc) {
      var h = loc && loc.hash;
      if (h && h !== location.hash.slice(1)) location.hash = h;
    });
  } catch (err) {}
  var ARTIFACT = 'https://claude.ai/artifact/Wwj4CCRYNRjQACcEwHVfU2';
  var appUrl = '';
  var fixLinks = function () {
    if (!appUrl) return;
    document.querySelectorAll('[data-copy]').forEach(function (b) {
      if (b.dataset.copy.indexOf(ARTIFACT) === 0) b.dataset.copy = appUrl + b.dataset.copy.slice(ARTIFACT.length);
    });
    document.querySelectorAll('.linkbox').forEach(function (i) {
      if (i.value.indexOf(ARTIFACT) === 0) i.value = appUrl + i.value.slice(ARTIFACT.length);
    });
  };
  new MutationObserver(fixLinks).observe(document.getElementById('view'), { childList: true, subtree: true });
  try { gs.run.withSuccessHandler(function (u) { appUrl = u || ''; fixLinks(); }).getAppUrl(); } catch (err) {}
})();
</script>
